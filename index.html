<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smooth Scroll to Top</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="content">
    <h1>Scroll Down the Page</h1>
    <p>Keep scrolling... the "Back to Top" button will appear in the bottom-right corner.</p>
    <div class="spacer"></div>
    <h2>You've reached the bottom!</h2>
    <p>Click the arrow button below to glide smoothly back to the top.</p>
  </main>

  <button id="scrollToTopBtn" class="scroll-btn" aria-label="Scroll to top" title="Go to top">
    ↑
  </button>

  <script src="script.js"></script>
</body>
</html>
